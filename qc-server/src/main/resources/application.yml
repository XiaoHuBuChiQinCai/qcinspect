server:
  port: 8080

spring:
  application:
    name: qc-server
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:qcinspect}?stringtype=unspecified
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
    hikari:
      maximum-pool-size: 10
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8
    default-property-inclusion: non_null
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 50MB

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    banner: false
    db-config:
      id-type: auto
      logic-delete-field: delFlag
      logic-delete-value: 1
      logic-not-delete-value: 0

qc:
  jwt:
    # 生产环境务必用环境变量 JWT_SECRET 覆盖，长度至少 32 字节
    secret: ${JWT_SECRET:qcinspect-dev-only-secret-change-in-production-0123456789}
    expire-minutes: ${JWT_EXPIRE_MINUTES:480}
  # local：落本地磁盘，零依赖，适合单厂内网部署
  # minio：走对象存储，配 qc.minio 使用
  storage:
    type: ${STORAGE_TYPE:local}
    local-dir: ${STORAGE_DIR:./data/files}
  default-admin:
    username: ${ADMIN_USER:admin}
    password: ${ADMIN_PASSWORD:admin123}
  minio:
    endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
    access-key: ${MINIO_ACCESS_KEY:minioadmin}
    secret-key: ${MINIO_SECRET_KEY:minioadmin}
    bucket: ${MINIO_BUCKET:qc-image}
    url-expire-days: 7

logging:
  level:
    com.qc.inspect: debug
