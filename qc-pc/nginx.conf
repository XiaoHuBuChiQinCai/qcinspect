# 工件质检 PC 端：静态站点 + /api 反向代理
#
# 为什么不是让 Spring Boot 托管 dist：
# 后端目前没有静态资源目录，也不该为了「少一个容器」把前端塞进 jar ——
# 前后端各自发版、Nginx 顺带做 gzip 和长缓存，比塞 jar 里省得多。

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 单张照片后端限制 10MB，留一倍余量；不设这个默认只有 1MB，手机拍照必失败
    client_max_body_size 20m;

    gzip on;
    gzip_min_length 1k;
    gzip_comp_level 5;
    gzip_vary on;
    gzip_types
        text/plain
        text/css
        text/xml
        application/json
        application/javascript
        application/xml
        image/svg+xml;

    # 打包产物文件名带内容 hash，可以放心长缓存
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # 前端走 hash 路由，但 index.html 仍然不能缓存，
    # 否则发版后旧页面拿着旧 chunk 名字去请求，白屏且难查
    location = /index.html {
        add_header Cache-Control "no-store";
    }

    location /api/ {
        proxy_pass http://app:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 默认 60s 对导出接口够用；CSV 导出大表慢的话调这里
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
